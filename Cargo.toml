[package]
name = "kubuntu-diagnostic-tool"
version = "0.1.0"
edition = "2021"
description = "A Kubuntu system diagnostic tool built with Clean Architecture and SOLID principles."
license = "MIT"

[lib]
name = "kubuntu_diagnostic_tool"
path = "src/lib.rs"

[[bin]]
name = "kubuntu-diagnostic-tool"
path = "src/main.rs"

[dependencies]
sysinfo = { version = "=0.30.13", default-features = false }
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ksni = { version = "0.3.6", features = ["blocking"] }
ctrlc = { version = "3.5.2" }

# Tauri GUI (optional feature)
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

[features]
default = []
gui = ["tauri", "tauri-plugin-opener", "tauri-plugin-process", "tauri-plugin-shell", "tauri-plugin-fs", "tokio"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"