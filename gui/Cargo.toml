[package]
name = "kdiag-gui"
version = "0.1.0"
edition = "2021"
description = "Tauri GUI frontend for the Kubuntu diagnostic tool"
license = "MIT"

[lib]
name = "kdiag_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "kdiag-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kubuntu-diagnostic-tool = { path = ".." }
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.30.13", default-features = false }

[features]
# tauri::generate_context! reads tauri.conf.json relative to this crate.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]